name: Build WIPI Emulator ARM32

on:
  workflow_dispatch:

jobs:
  build-arm32:
    runs-on: ubuntu-latest

    steps:

      # 1. 소스 가져오기
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Java 17 설정
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # 3. Rust 설정
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi


      # 4. ARM32 Rust target 설치
      - name: Install Rust ARM32 target
        run: |
          rustup target add armv7-linux-androideabi


      # 5. Android SDK 설정
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # 6. Android SDK / NDK 설치
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"


      # 7. Android NDK 환경 설정
      - name: Setup Android NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV

          echo "NDK=$NDK"

          ls -la "$NDK"

          ls -la \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64"


      # 8. ARM32용 AAudio 라이브러리 확인
      - name: Check ARM32 Android libraries
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "Checking AAudio library..."

          find "$NDK" -type f \
            \( -name "libaaudio.so" -o -name "libaaudio.a" \) \
            -print


      # 9. cargo-ndk 설치
      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk


      # 10. cargo-ndk 환경 확인
      - name: Verify cargo-ndk environment
        working-directory: rust
        run: |
          cargo ndk-env -t armeabi-v7a


      # 11. WIPI Emulator ARM32 네이티브 라이브러리 빌드
      - name: Build WIPI ARM32 native library
        working-directory: rust
        env:
          ANDROID_PLATFORM: 26
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -o ../android/app/src/main/jniLibs \
            build \
            --release \
            -p wipi_android


      # 12. ARM32 라이브러리 생성 확인
      - name: Verify ARM32 native library
        run: |
          echo "=== Generated native libraries ==="

          find android/app/src/main/jniLibs \
            -type f \
            -print


      # 13. Android ABI를 ARM32로 변경
      - name: Change Android ABI to ARM32
        run: |
          sed -i \
            's/listOf("arm64-v8a", "x86_64")/listOf("armeabi-v7a")/' \
            android/app/build.gradle.kts


      # 14. ABI 설정 확인
      - name: Verify Android ABI configuration
        run: |
          echo "=== ABI configuration ==="

          grep -n "abiFilters" \
            android/app/build.gradle.kts || true

          grep -n "armeabi-v7a" \
            android/app/build.gradle.kts || true


      # 15. Gradle 실행 권한 부여
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew


      # 16. ARM32 APK 빌드
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace


      # 17. APK 생성 확인
      - name: Verify APK
        run: |
          echo "=== Generated APK ==="

          ls -lh \
            android/app/build/outputs/apk/release/*.apk


      # 18. ARM32 APK 업로드
      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: WIPI-Emulator-ARM32
          path: android/app/build/outputs/apk/release/*.apk
