name: Build WIPI Emulator ARM32

on:
  workflow_dispatch:

jobs:
  build-arm32:
    runs-on: ubuntu-latest

    steps:

      # 1. 소스 다운로드
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # 3. Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi


      # 4. ARM32 Rust target 확인
      - name: Install Rust ARM32 target
        run: |
          rustup target add armv7-linux-androideabi
          rustup target list --installed


      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # 6. Android SDK / Build Tools / NDK 설치
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"


      # 7. Android NDK 설정
      - name: Setup Android NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$NDK"
          echo "ANDROID_NDK_ROOT=$NDK"

          ls -la "$NDK"
          ls -
