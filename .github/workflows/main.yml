name: Build WIPI Emulator ARM32

on:
  workflow_dispatch:

jobs:
  build-arm32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install Rust ARM32 target
        run: |
          rustup target add armv7-linux-androideabi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"

      - name: Setup Android NDK
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV

          echo "NDK=$NDK"

          ls -la "$NDK"
          ls -la "$NDK/toolchains/llvm/prebuilt/linux-x86_64"

      - name: Check ARM32 Android libraries
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "Checking AAudio library..."

          find "$NDK" \
            -path "*arm-linux-androideabi*" \
            -name "libaaudio.so" \
            -o -path "*arm-linux-androideabi*" \
            -name "libaaudio.a" \
            -print

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk

      - name: Verify cargo-ndk environment
        working-directory: rust
        run: |
          cargo ndk-env -t armeabi-v7a

      - name: Build WIPI ARM32 native library
        working-directory: rust
        env:
          ANDROID_PLATFORM: 26
        run: |
          cargo ndk \
            -t armeabi-v7a \
            -p wipi_android \
            -o ../android/app/src/main/jniLibs \
            build \
            --release

      - name: Verify ARM32 native library
        run: |
          find android/app/src/main/jniLibs -type f -print

      - name: Change Android ABI to ARM32
        run: |
          sed -i 's/listOf("arm64-v8a", "x86_64")/listOf("armeabi-v7a")/' \
            android/app/build.gradle.kts

      - name: Verify Android ABI configuration
        run: |
          grep -n "abiFilters" android/app/build.gradle.kts || true
          grep -n "armeabi-v7a" android/app/build.gradle.kts || true

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/release/*.apk

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: WIPI-Emulator-ARM32
          path: android/app/build/outputs/apk/release/*.apk
